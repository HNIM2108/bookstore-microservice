version: '3.8'

services:
  # 1. HẠ TẦNG DỮ LIỆU & TIN NHẮN
  mysql-db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1230
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql # Tự động tạo 13 DB
      - ./mysql_data:/var/lib/mysql

  neo4j-db:
    image: neo4j:latest
    environment:
      # Cấu hình tài khoản mặc định (user: neo4j / pass: 12345678)
      - NEO4J_AUTH=neo4j/12345678
      - NEO4J_server_memory_heap_initial__size=100m
      - NEO4J_server_memory_heap_max__size=250m
      - NEO4J_server_memory_pagecache_size=100m
    ports:
      - "7474:7474"  # Cổng để bạn xem giao diện Web (Graph Browser)
      - "7687:7687"  # Cổng Bolt để code Python kết nối ngầm
    volumes:
      - ./neo4j_data:/data  # Lưu dữ liệu đồ thị ra ngoài máy thật để không bị mất

  # ollama-service:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama_data:/root/.ollama
  #   # Thiết lập biến môi trường để các service khác có thể gọi được API của Ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=123456

  # 2. CỬA NGÕ GATEWAY (Chứa giao diện ULTRA TECH)
  # api-gateway:
  #   build: ./api-gateway
  #   volumes:
  #     - ./api-gateway:/app
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #     - DB_NAME=api_db
  #     - DB_USER=root
  #     - DB_PASSWORD=1230
  #     - DB_HOST=mysql-db
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - mysql-db
  #     - user-service

  # 2. CỬA NGÕ GIAO DIỆN (Django BFF - Trả về HTML cũ của bạn)
  api-gateway:
    build: ./api-gateway
    volumes:
      - ./api-gateway:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=api_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    # LƯU Ý: XÓA phần "ports: - 8000:8000" ở đây để nhường cổng cho Nginx
    depends_on:
      - mysql-db
      - user-service

  # CẢNH SÁT GIAO THÔNG (Nginx)
  nginx-proxy:
    image: nginx:latest
    ports:
      - "8000:80"  # Postman và Trình duyệt sẽ gọi vào đây
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - user-service
      - product-service
      - cart-service
      - order-service

  # 3. CÁC SERVICE CHÍNH (Xử lý Saga & Event Bus)
  user-service:
    build: ./user-service
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=user_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    ports:
      - "8012:8000"
    depends_on:
      - mysql-db

  order-service:
    build: ./order-service
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=order_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    ports:
      - "8004:8000"
    depends_on:
      - mysql-db
      - rabbitmq

  # Luồng xử lý ngầm (Consumers)
  order-consumer:
    build: ./order-service
    command: python consumer.py
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=order_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    depends_on:
      - mysql-db
      - rabbitmq
    restart: on-failure

  pay-service:
    build: ./pay-service
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=pay_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    ports:
      - "8005:8000"
    depends_on:
      - mysql-db
      - rabbitmq

  pay-consumer:
    build: ./pay-service
    command: python consumer.py
    environment: &pay-env
      - PYTHONUNBUFFERED=1
      - DB_NAME=pay_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    depends_on: [mysql-db, rabbitmq]
    restart: on-failure

  pay-refund-consumer:
    build: ./pay-service
    command: python refund_consumer.py
    environment: *pay-env
    depends_on: [mysql-db, rabbitmq]
    restart: on-failure

  ship-service:
    build: ./ship-service
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=ship_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    ports:
      - "8006:8000"
    depends_on: [mysql-db, rabbitmq]

  ship-consumer:
    build: ./ship-service
    command: python consumer.py
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=ship_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    depends_on: [mysql-db, rabbitmq]
    restart: on-failure

  # 4. CÁC SERVICE VỆ TINH CÒN LẠI
  book-service:
    build: ./book-service
    environment: [PYTHONUNBUFFERED=1, DB_NAME=book_db, DB_USER=root, DB_PASSWORD=1230, DB_HOST=mysql-db]
    ports: ["8002:8000"]
    depends_on: [mysql-db]

  cart-service:
    build: ./cart-service
    environment: [PYTHONUNBUFFERED=1, DB_NAME=cart_db, DB_USER=root, DB_PASSWORD=1230, DB_HOST=mysql-db]
    ports: ["8003:8000"]
    depends_on: [mysql-db]

  customer-service:
    build: ./customer-service
    environment: [PYTHONUNBUFFERED=1, DB_NAME=customer_db, DB_USER=root, DB_PASSWORD=1230, DB_HOST=mysql-db]
    ports: ["8001:8000"]
    depends_on: [mysql-db]

  catalog-service:
    build: ./catalog-service
    environment: [PYTHONUNBUFFERED=1, DB_NAME=catalog_db, DB_USER=root, DB_PASSWORD=1230, DB_HOST=mysql-db]
    ports: ["8007:8000"]
    depends_on: [mysql-db]

  comment-rate-service:
    build: ./comment-rate-service
    environment: [PYTHONUNBUFFERED=1, DB_NAME=comment_rate_db, DB_USER=root, DB_PASSWORD=1230, DB_HOST=mysql-db]
    ports: ["8008:8000"]
    depends_on: [mysql-db]

  manager-service:
    build: ./manager-service
    environment: [PYTHONUNBUFFERED=1, DB_NAME=manager_db, DB_USER=root, DB_PASSWORD=1230, DB_HOST=mysql-db]
    ports: ["8009:8000"]
    depends_on: [mysql-db]

  recommender-ai-service:
    build: ./recommender-ai-service
    volumes:
      - ./recommender-ai-service:/app
    environment: [PYTHONUNBUFFERED=1, DB_NAME=recommender_ai_db, DB_USER=root, DB_PASSWORD=1230, DB_HOST=mysql-db]
    ports: ["8010:8000"]
    depends_on: [mysql-db]
    command: python manage.py runserver 0.0.0.0:8000 --noreload

  staff-service:
    build: ./staff-service
    environment: [PYTHONUNBUFFERED=1, DB_NAME=staff_db, DB_USER=root, DB_PASSWORD=1230, DB_HOST=mysql-db]
    ports: ["8011:8000"]
    depends_on: [mysql-db]

  product-service:
    build: ./product-service
    volumes:
      - ./product-service:/app  # Ánh xạ code để sửa lỗi chạy luôn
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=product_db
      - DB_USER=root
      - DB_PASSWORD=1230
      - DB_HOST=mysql-db
    ports:
      - "8013:8000"
    depends_on:
      - mysql-db