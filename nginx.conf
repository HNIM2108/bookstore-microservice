events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 1. Các luồng API ngầm (Dành cho việc gọi dữ liệu)
        location /api/users/ {
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass http://user-service:8000;
        }

        location /api/products/ {
            rewrite ^/api/products/(.*) /products/$1 break;
            proxy_pass http://product-service:8000;
        }

        location /api/cart/ {
            proxy_pass http://cart-service:8000;
        }

        location /api/orders/ {
            proxy_pass http://order-service:8000;
        }

        # 2. LUỒNG GIAO DIỆN CHÍNH (Điều hướng về Django API Gateway cũ)
        location / {
            proxy_pass http://api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}