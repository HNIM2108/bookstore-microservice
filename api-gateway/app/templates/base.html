<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ULTRA TECH - AI Product Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0b0e14; --card-bg: #1a1d23; --primary-color: #6366f1; --text-muted: #94a3b8; }
        body { background-color: var(--bg-color); color: white; font-family: 'Inter', sans-serif; }
        .navbar { background: rgba(11, 14, 20, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #2d3139; }
        .auth-card { background: var(--card-bg); border: 1px solid #2d3139; border-radius: 16px; padding: 40px; max-width: 450px; margin: 100px auto; }
        .book-card { background: var(--card-bg); border: 1px solid #2d3139; border-radius: 12px; transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-5px); border-color: var(--primary-color); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.1); }
        .form-control { background: #0b0e14; border: 1px solid #2d3139; color: white; border-radius: 8px; padding: 12px; }
        .form-control:focus { background: #0b0e14; border-color: var(--primary-color); color: white; box-shadow: none; }
        .btn-primary { background: var(--primary-color); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; }
        .btn-primary:hover { background: #4f46e5; }
        .nav-link { color: var(--text-muted); cursor: pointer; }
        .nav-link.active { color: white; font-weight: 600; }
        .text-gradient { background: linear-gradient(90deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="#">🌌 ULTRA TECH</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" id="nav-store" onclick="switchTab('store')" style="display:none;">Store</a>
            <a class="nav-link" id="nav-profile" onclick="viewProfile()" style="display:none;">Profile</a>
            <a class="nav-link" id="nav-checkout" onclick="switchTab('checkout')" style="display:none;">Checkout</a>
            <a class="nav-link active" id="auth-status" href="#">Login</a>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<button id="chatbot-toggle-btn" class="btn btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center" 
        style="position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; font-size: 28px; z-index: 1000;" 
        onclick="toggleChatbot()">
    🤖
</button>

<div id="chatbot-window" class="card shadow-lg" 
     style="position: fixed; bottom: 100px; right: 30px; width: 350px; height: 500px; display: none; z-index: 1000; background: var(--card-bg); border: 1px solid #2d3139; border-radius: 16px; overflow: hidden;">
    <div class="card-header text-white d-flex justify-content-between align-items-center p-3" style="background: linear-gradient(90deg, #a855f7, #6366f1); border-bottom: none;">
        <h6 class="m-0 fw-bold">🧠 ULTRA AI Assistant</h6>
        <button type="button" class="btn-close btn-close-white" onclick="toggleChatbot()" style="font-size: 12px;"></button>
    </div>
    
    <div id="chat-messages" class="card-body" style="overflow-y: auto; height: 350px; background: var(--bg-color); padding: 15px;">
        <div class="mb-3">
            <div class="p-2 rounded-3 bg-secondary text-white d-inline-block small" style="max-width: 80%; opacity: 0.9;">
                Xin chào! Tôi là AI tư vấn viên của Ultra Tech. Tôi có thể giúp gì cho bạn hôm nay?
            </div>
        </div>
    </div>
    
    <div class="card-footer p-2" style="background: var(--card-bg); border-top: 1px solid #2d3139;">
        <div class="input-group">
            <input type="text" id="chat-input" class="form-control form-control-sm border-0 text-white" placeholder="Nhập tin nhắn..." style="background: #0b0e14;" onkeypress="if(event.key === 'Enter') sendChatMessage()">
            <button class="btn btn-primary btn-sm px-3" onclick="sendChatMessage()">Gửi</button>
        </div>
    </div>
</div>

<footer class="text-center mt-5 py-4 text-muted small border-top border-dark">
    © 2026 Ultra Tech AI E-commerce.
</footer>

<script>
    const GATEWAY_URL = window.location.origin;
    let currentViewingProductId = null; // Biến lưu vết xem khách đang đứng ở trang sản phẩm nào

    function switchTab(tab) {
        document.getElementById('store-section').style.display = tab === 'store' ? 'block' : 'none';
        document.getElementById('checkout-section').style.display = tab === 'checkout' ? 'block' : 'none';
        document.getElementById('detail-section').style.display = tab === 'detail' ? 'block' : 'none';
        document.getElementById('profile-section').style.display = tab === 'profile' ? 'block' : 'none';
        
        document.getElementById('nav-store').classList.toggle('active', tab === 'store');
        document.getElementById('nav-profile').classList.toggle('active', tab === 'profile');
        document.getElementById('nav-checkout').classList.toggle('active', tab === 'checkout');

        if (tab !== 'detail') currentViewingProductId = null; // Xóa vết nếu rời đi
    }

    function showDashboard() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('auth-status').style.display = 'none';
        document.getElementById('nav-store').style.display = 'block';
        document.getElementById('nav-profile').style.display = 'block';
        document.getElementById('nav-checkout').style.display = 'block';
        switchTab('store');
        fetchProducts(); 
    }

    function viewProfile() {
        switchTab('profile');
        fetchBehaviorHistory(1); 
    }

    function logout() { localStorage.removeItem('jwt_token'); location.reload(); }

    async function login() {
        const res = await fetch(`${GATEWAY_URL}/api/token/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('jwt_token', data.access);
            showDashboard();
        } else alert("Sai thông tin đăng nhập!");
    }

    async function fetchProducts() {
        try {
            const res = await fetch(`${GATEWAY_URL}/products/`, { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('jwt_token') } });
            if (res.ok) renderProducts(await res.json());
        } catch (e) { document.getElementById('product-catalog').innerHTML = `<div class="alert alert-danger">Lỗi kết nối đến Product Service.</div>`; }
    }

    async function fetchBehaviorHistory(customerId) {
        try {
            const res = await fetch(`${GATEWAY_URL}/customers/${customerId}/behavior/`, {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('jwt_token') }
            });
            if (res.ok) {
                const logs = await res.json();
                let html = '';
                if (logs.length === 0) {
                    html = '<p class="text-muted text-center mt-5">Chưa có hoạt động nào được ghi nhận.</p>';
                } else {
                    logs.forEach(log => {
                        let actionText = log.action === 'view_detail' ? '👁️ Xem chi tiết' : 
                                        (log.action === 'add_to_cart' ? '🛒 Thêm vào giỏ' : `⚡ ${log.action}`);
                        let timeObj = new Date(log.timestamp);
                        html += `
                        <div class="border-bottom border-dark py-3">
                            <div class="d-flex w-100 justify-content-between align-items-center">
                                <h6 class="mb-1 fw-bold text-white">${actionText} <span class="badge bg-secondary ms-2">SP ID: ${log.product_id || log.book_id}</span></h6>
                                <small class="text-muted">${timeObj.toLocaleString('vi-VN')}</small>
                            </div>
                        </div>`;
                    });
                }
                document.getElementById('behavior-list').innerHTML = html;
            }
        } catch (e) {}
    }

    function renderProducts(products) {
        let html = '';
        products.forEach(p => {
            let subText = p.attributes.brand || p.attributes.author || "Sản phẩm cao cấp";
            let icon = p.category_id === 1 ? "💻" : p.category_id === 2 ? "📱" : p.category_id === 3 ? "📚" : p.category_id === 4 ? "👕" : "📦";

            html += `
            <div class="col-md-4 col-lg-3 mb-4">
                <div class="book-card p-3 h-100 d-flex flex-column">
                    <div class="bg-secondary rounded mb-3 d-flex align-items-center justify-content-center" style="height: 150px; opacity: 0.2;">
                        <span class="fs-1">${icon}</span>
                    </div>
                    <h5 class="fw-bold mb-1">${p.name}</h5>
                    <p class="text-info small mb-2">${subText}</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="text-success fw-bold fs-5">$${p.price}</span>
                        <button class="btn btn-sm btn-outline-light" onclick="viewProductDetail(${p.id})">Chi Tiết</button>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('product-catalog').innerHTML = html;
    }

    async function viewProductDetail(productId) {
        try {
            simulateAITracking('view_detail', productId);
            const res = await fetch(`${GATEWAY_URL}/products/${productId}/`, { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('jwt_token') } });
            if (res.ok) {
                const product = await res.json();
                document.getElementById('detail-title').innerText = product.name;
                document.getElementById('detail-price').innerText = `$${product.price}`;
                document.getElementById('detail-stock').innerText = product.stock;
                
                let attrHtml = '';
                if(product.attributes) {
                    Object.entries(product.attributes).forEach(([key, value]) => {
                        attrHtml += `<span class="badge bg-dark border border-secondary me-2 mb-2 p-2" style="font-size: 0.85rem;">
                                        <span class="text-muted">${key.toUpperCase()}:</span> <span class="text-white">${value}</span>
                                     </span>`;
                    });
                }
                document.getElementById('detail-attributes').innerHTML = attrHtml;
                
                let icon = product.category_id === 1 ? "💻" : product.category_id === 2 ? "📱" : product.category_id === 3 ? "📚" : product.category_id === 4 ? "👕" : "📦";
                document.getElementById('detail-icon').innerText = icon;

                document.getElementById('btn-buy-now').onclick = () => selectToBuy(product.price);
                switchTab('detail');
                currentViewingProductId = productId; // BÁO CHO AI BIẾT KHÁCH ĐANG XEM SẢN PHẨM NÀY
                
                fetchAIRecommendations(productId);
                // THÊM MỚI: Gọi AI Đồ thị (Neo4j)
                fetchGraphRecommendations(productId);
            }
        } catch (e) { console.error("Lỗi:", e); }
    }

    // GỌI AI GỢI Ý ĐỒ THỊ (NEO4J)
    async function fetchGraphRecommendations(productId) {
        const graphContainer = document.getElementById('graph-similar-books');
        graphContainer.innerHTML = `<div class="col-12 text-muted small"><div class="spinner-border spinner-border-sm me-2 text-success"></div> Đang lục tìm dữ liệu mạng lưới hành vi...</div>`;
        
        try {
            // Gọi thẳng vào API Neo4j ở cổng 8010
            const response = await fetch(`http://localhost:8010/api/graph-recommend/${productId}/`);
            if (!response.ok) throw new Error('Lỗi AI Graph');
            
            const data = await response.json();
            const recommended = data.graph_recommendations;
            graphContainer.innerHTML = ''; 
            
            if (recommended && recommended.length > 0) {
                recommended.forEach(item => {
                    graphContainer.innerHTML += `
                        <div class="col-md-6 mb-3">
                            <div class="card h-100 shadow-sm border-0 bg-dark text-light" style="cursor: pointer;" onclick="viewProductDetail(${item.id})">
                                <div class="card-body p-3 d-flex align-items-center border-start border-success border-4">
                                    <div class="bg-secondary rounded me-3 d-flex align-items-center justify-content-center text-success" style="min-width: 40px; height: 55px; opacity: 0.8; font-size: 24px;">🔗</div>
                                    <div>
                                        <h6 class="mb-1 fw-bold text-truncate" style="max-width: 150px;">${item.name}</h6>
                                        <span class="badge bg-success text-light" style="font-size: 0.75rem;">${item.match_score} khách hàng đã mua cùng</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else { graphContainer.innerHTML = '<div class="col-12 text-muted small fst-italic">Sản phẩm này chưa có lịch sử mua kèm.</div>'; }
        } catch (error) { graphContainer.innerHTML = '<div class="col-12 text-danger small">Hệ thống Đồ thị đang cập nhật...</div>'; }
    }

    async function fetchAIRecommendations(productId) {
        const aiContainer = document.getElementById('ai-similar-books');
        aiContainer.innerHTML = `<div class="col-12 text-muted small"><div class="spinner-border spinner-border-sm me-2"></div> AI đang phân tích dữ liệu...</div>`;
        
        try {
            const response = await fetch(`http://localhost:8010/api/recommend/${productId}/`);
            if (!response.ok) throw new Error('Lỗi AI');
            
            const recommended = await response.json();
            aiContainer.innerHTML = ''; 
            
            if (recommended && recommended.length > 0) {
                recommended.forEach(item => {
                    let name = item.title || item.name || `Sản phẩm ID: ${item.id}`;
                    let subInfo = item.category || item.author || "Gợi ý thông minh";
                    aiContainer.innerHTML += `
                        <div class="col-md-6 mb-3">
                            <div class="card h-100 shadow-sm border-0 bg-dark text-light" style="cursor: pointer;" onclick="viewProductDetail(${item.id})">
                                <div class="card-body p-3 d-flex align-items-center">
                                    <div class="bg-secondary rounded me-3 d-flex align-items-center justify-content-center" style="min-width: 40px; height: 55px; opacity: 0.5;">✨</div>
                                    <div>
                                        <h6 class="mb-1 fw-bold text-truncate" style="max-width: 150px;">${name}</h6>
                                        <span class="badge bg-success text-light" style="font-size: 0.75rem;">${subInfo}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else { aiContainer.innerHTML = '<div class="col-12 text-muted small fst-italic">Không có gợi ý.</div>'; }
        } catch (error) { aiContainer.innerHTML = '<div class="col-12 text-danger small">AI Service đang học dữ liệu mới...</div>'; }
    }

    async function simulateAITracking(action, productId) {
        console.log(`[AI TRACKING] Event: '${action}' | ProductID: ${productId}`);
        try {
            await fetch(`${GATEWAY_URL}/customers/track/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('jwt_token') },
                body: JSON.stringify({ customer_id: 1, book_id: productId, action: action })
            });
        } catch (e) {}
        
        const banner = document.getElementById('ai-recommendation-banner');
        if(banner) {
            banner.style.display = 'block';
            banner.innerText = `🤖 AI đã ghi nhận bạn vừa xem sản phẩm ID: ${productId}...`;
            setTimeout(() => { banner.style.display = 'none'; }, 3000);
        }
    }

    function selectToBuy(price) { document.getElementById('total_amount').value = price; switchTab('checkout'); }
    
    async function createOrder() {
        const payload = {
            customer_id: parseInt(document.getElementById('customer_id').value), cart_id: parseInt(document.getElementById('cart_id').value),
            total_amount: parseFloat(document.getElementById('total_amount').value), address: document.getElementById('address').value
        };
        const res = await fetch(`${GATEWAY_URL}/orders/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('jwt_token') },
            body: JSON.stringify(payload)
        });
        if (res.ok) { alert("Hệ thống đã nhận đơn hàng!"); switchTab('store'); } else alert("Lỗi gửi đơn!");
    }

    // Ẩn/Hiện Chatbot
    function toggleChatbot() {
        const chatWindow = document.getElementById('chatbot-window');
        chatWindow.style.display = chatWindow.style.display === 'none' ? 'block' : 'none';
        if(chatWindow.style.display === 'block') document.getElementById('chat-input').focus();
    }

    // Gửi tin nhắn lên AI Service
    async function sendChatMessage() {
        const inputField = document.getElementById('chat-input');
        const message = inputField.value.trim();
        if (!message) return;

        // 1. In tin nhắn của người dùng ra màn hình
        appendMessage('user', message);
        inputField.value = '';

        // 2. In bong bóng "AI đang gõ..."
        const loadingId = appendMessage('ai', '<div class="spinner-border spinner-border-sm text-info"></div> AI đang suy nghĩ...');

        try {
            // 3. Gọi thẳng vào API RAG cổng 8010
            const response = await fetch('http://localhost:8010/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: message, 
                    product_id: currentViewingProductId // Gửi kèm ngữ cảnh sản phẩm đang xem
                })
            });

            const data = await response.json();
            
            // 4. Xóa bong bóng loading và in câu trả lời thật
            document.getElementById(loadingId).remove();
            
            if (response.ok) {
                appendMessage('ai', data.reply);
            } else {
                appendMessage('ai', `<span class="text-danger">Lỗi: ${data.error}</span>`);
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('ai', '<span class="text-danger">Hệ thống AI đang quá tải hoặc chưa khởi động xong.</span>');
        }
    }

    // Hàm phụ trợ để vẽ bong bóng chat
    function appendMessage(sender, text) {
        const chatMessages = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'mb-3 d-flex ' + (sender === 'user' ? 'justify-content-end' : 'justify-content-start');
        
        const msgId = 'msg-' + Date.now();
        msgDiv.id = msgId;

        const bubble = document.createElement('div');
        bubble.className = 'p-2 rounded-3 small ' + (sender === 'user' ? 'bg-primary text-white' : 'bg-dark text-light border border-secondary');
        bubble.style.maxWidth = '85%';
        bubble.innerHTML = text;

        msgDiv.appendChild(bubble);
        chatMessages.appendChild(msgDiv);
        
        // Tự động cuộn xuống tin nhắn mới nhất
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        return msgId;
    }
</script>
</body>
</html>
