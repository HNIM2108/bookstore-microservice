<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ULTRA TECH - Microservices Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0b0e14; --card-bg: #1a1d23; --primary-color: #6366f1; --text-muted: #94a3b8; }
        body { background-color: var(--bg-color); color: white; font-family: 'Inter', sans-serif; }
        .navbar { background: rgba(11, 14, 20, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #2d3139; }
        .auth-card { background: var(--card-bg); border: 1px solid #2d3139; border-radius: 16px; padding: 40px; max-width: 450px; margin: 100px auto; }
        .form-control { background: #0b0e14; border: 1px solid #2d3139; color: white; border-radius: 8px; padding: 12px; }
        .form-control:focus { background: #0b0e14; border-color: var(--primary-color); color: white; box-shadow: none; }
        .btn-primary { background: var(--primary-color); border: none; padding: 12px; border-radius: 8px; font-weight: 600; }
        .btn-primary:hover { background: #4f46e5; }
        .nav-link { color: var(--text-muted); }
        .nav-link.active { color: white; font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="#">🌌 ULTRA TECH</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="#">Shop</a>
            <a class="nav-link active" id="auth-status" href="#">Login</a>
            <button class="btn btn-outline-light btn-sm ms-3">Cart (0)</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="login-section" class="auth-card text-center">
        <div class="mb-4">
            <div class="bg-primary d-inline-block p-3 rounded-3 mb-3">🚀</div>
            <h2 class="fw-bold">Welcome Back</h2>
            <p class="text-secondary">Sign in to your account</p>
        </div>
        <div class="text-start">
            <div class="mb-3">
                <label class="form-label text-muted small">Username</label>
                <input type="text" id="username" class="form-control" value="admin">
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">Password</label>
                <input type="password" id="password" class="form-control" value="123456">
            </div>
            <button class="btn btn-primary w-100" onclick="login()">Sign In</button>
            <p class="mt-3 small text-center text-muted">Don't have an account? <a href="#" class="text-primary text-decoration-none">Request membership</a></p>
        </div>
    </div>

    <div id="dashboard" class="mt-5" style="display:none;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="auth-card text-start m-0 w-100">
                    <h3 class="mb-4 fw-bold">🚀 Khởi Tạo Đơn Hàng</h3>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="text-muted small">Mã Khách Hàng</label>
                            <input type="number" id="customer_id" class="form-control" value="1">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="text-muted small">Mã Giỏ Hàng</label>
                            <input type="number" id="cart_id" class="form-control" value="1">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small">Tổng Tiền (USD)</label>
                        <input type="number" id="total_amount" class="form-control" value="500">
                    </div>
                    <div class="mb-4">
                        <label class="text-muted small">Địa Chỉ Giao Hàng</label>
                        <input type="text" id="address" class="form-control" placeholder="Ví dụ: Hà Nội">
                    </div>
                    <button class="btn btn-primary w-100" onclick="createOrder()">Xác nhận đặt hàng</button>
                    <button class="btn btn-link w-100 text-muted mt-2 text-decoration-none small" onclick="logout()">Đăng xuất tài khoản</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 py-4 text-muted small border-top border-dark">
    © 2026 Ultra Tech Microservices Demo. All rights reserved.
</footer>

<script>
    // Giữ nguyên logic Javascript cũ của bạn, chỉ thay đổi GATEWAY_URL nếu cần
    const GATEWAY_URL = window.location.origin;

    function showDashboard() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('auth-status').innerText = 'Dashboard';
    }

    function logout() {
        localStorage.removeItem('jwt_token');
        location.reload();
    }

    async function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const res = await fetch(`${GATEWAY_URL}/api/token/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('jwt_token', data.access);
            showDashboard();
        } else alert("Sai thông tin!");
    }

    async function createOrder() {
        const payload = {
            customer_id: parseInt(document.getElementById('customer_id').value),
            cart_id: parseInt(document.getElementById('cart_id').value),
            total_amount: parseFloat(document.getElementById('total_amount').value),
            address: document.getElementById('address').value
        };
        const res = await fetch(`${GATEWAY_URL}/orders/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('jwt_token')
            },
            body: JSON.stringify(payload)
        });
        if (res.ok) alert("Hệ thống đã nhận đơn hàng!");
        else alert("Lỗi gửi đơn!");
    }
</script>
</body>
</html>
