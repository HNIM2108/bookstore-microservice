<div id="checkout-section" class="mt-5" style="display:none;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="auth-card text-start w-100 m-0">
                <h3 class="mb-4 fw-bold text-gradient">🚀 Xác Nhận Đặt Hàng</h3>
                <p class="text-muted small mb-4">Hệ thống sẽ tự động tổng hợp giỏ hàng của bạn để lên đơn.</p>
                
                <div class="mb-4">
                    <label class="form-label text-muted small">Địa Chỉ Giao Hàng</label>
                    <input type="text" id="shipping_address" class="form-control" placeholder="Nhập địa chỉ chi tiết..." value="Hà Nội, Việt Nam">
                </div>
                
                <button class="btn btn-primary w-100 py-2 fs-5" id="btn-confirm-checkout" onclick="createOrder()">
                    💳 Chốt Đơn Ngay
                </button>
                <button class="btn btn-link w-100 text-muted mt-3 text-decoration-none small" onclick="switchTab('store')">
                    ← Quay lại mua thêm
                </button>
            </div>
        </div>
    </div>
</div>
