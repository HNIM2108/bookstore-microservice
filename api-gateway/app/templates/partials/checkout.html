<div id="checkout-section" class="mt-4" style="display:none;">
    <div class="auth-card m-0 w-100" style="max-width: 700px; margin: 40px auto !important;">
        <h3 class="fw-bold mb-4 text-gradient">🏁 Xác Nhận Đặt Hàng</h3>
        
        <div id="checkout-items-summary" class="mb-4 border border-secondary rounded p-3 bg-dark">
            <p class="text-muted text-center">Đang tải tóm tắt đơn hàng...</p>
        </div>

        <div class="mb-3">
            <label class="form-label small text-info fw-bold">📍 Địa chỉ giao hàng</label>
            <textarea id="address" class="form-control bg-dark text-white border-secondary" rows="2" placeholder="Nhập địa chỉ nhận hàng..."></textarea>
        </div>

        <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-3">
            <h5 class="m-0">Thanh toán: <span id="checkout-total" class="text-success fw-bold">$0.00</span></h5>
            <button id="btn-confirm-checkout" class="btn btn-success px-4 fw-bold" onclick="createOrder()">XÁC NHẬN ĐẶT HÀNG</button>
        </div>
    </div>
</div>
