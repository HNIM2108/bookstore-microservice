<div id="cart-section" class="mt-5" style="display:none;">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="auth-card text-start w-100 m-0">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold m-0">🛒 Giỏ Hàng Của Bạn</h3>
                    <button class="btn btn-sm btn-outline-info" onclick="viewCart()">🔄 Cập nhật</button>
                </div>
                
                <!-- Nơi chứa danh sách sản phẩm trong giỏ -->
                <div id="cart-items-container" class="mb-4" style="max-height: 300px; overflow-y: auto; padding-right: 10px;">
                    <div class="text-center text-muted"><div class="spinner-border spinner-border-sm"></div> Đang tải giỏ hàng...</div>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mt-4 border-top border-secondary pt-3">
                    <h5 class="fw-bold m-0 text-light">Tổng cộng: <span id="cart-total" class="text-success fs-4 fw-bold">$0.00</span></h5>
                    <button class="btn btn-primary px-4" onclick="proceedToCheckout()">Tiến hành Thanh toán ➔</button>
                </div>
                <button class="btn btn-link w-100 text-muted mt-3 text-decoration-none small" onclick="switchTab('store')">← Tiếp tục mua sắm</button>
            </div>
        </div>
    </div>
</div>
