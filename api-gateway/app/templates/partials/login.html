<div id="login-section" class="auth-card text-center">
    <div class="mb-4">
        <div class="bg-primary d-inline-block p-3 rounded-3 mb-3">🚀</div>
        <h2 class="fw-bold">Welcome Back</h2>
        <p class="text-secondary">Sign in to your account</p>
    </div>
    <div class="text-start">
        <div class="mb-3">
            <label class="form-label text-muted small">Username</label>
            <input type="text" id="username" class="form-control" value="admin">
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small">Password</label>
            <input type="password" id="password" class="form-control" value="123456">
        </div>
        <button class="btn btn-primary w-100" onclick="login()">Sign In</button>
    </div>
</div>
