<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT Bookstore - Microservices</title>
    <!-- Dùng thư viện Bootstrap cho giống phong cách form/table cũ của bạn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">📚 UT Bookstore</a>
            <div class="d-flex text-white align-items-center">
                <span id="userInfo" class="me-3">Chưa đăng nhập</span>
                <button class="btn btn-outline-light me-2" id="loginBtn" onclick="login()">Đăng nhập</button>
                <button class="btn btn-warning" onclick="checkout()">🛒 Giỏ hàng (<span id="cartCount">0</span>)</button>
            </div>
        </div>
    </nav>

    <!-- Khu vực hiển thị sản phẩm -->
    <div class="container mt-4">
        <h2 class="mb-4">Danh sách Sách & Sản phẩm</h2>
        <div class="row" id="productList">
            <!-- Sản phẩm sẽ được Javascript đổ vào đây -->
        </div>
    </div>

    <!-- Nhúng file logic -->
    <script src="app.js"></script>
</body>
</html>
